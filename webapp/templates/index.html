<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nền Tảng Thực Nghiệm & Dự Báo AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=clean_mas_1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="header-banner">
            <h1>NỀN TẢNG THỰC NGHIỆM & DỰ BÁO AI</h1>
            <p>Mạng Tích Chập (CNN), Mạng Hồi Quy (RNN/LSTM), Knowledge Graph + RAG & Hệ Đa Agent (MAS)</p>
        </header>

        <main class="glass-panel">
            <!-- Thanh Chọn Mô Hình Trí Tuệ Nhân Tạo (Đã bỏ Chương 1, 2) -->
            <div class="model-nav">
                <button type="button" class="tab-btn" data-model="cnn">Mạng Tích Chập (CNN)</button>
                <button type="button" class="tab-btn" data-model="rnn_lstm">Mạng Hồi Quy (RNN / LSTM)</button>
                <button type="button" class="tab-btn" data-model="kg_rag">Knowledge Graph & RAG</button>
                <button type="button" class="tab-btn active" data-model="multi_agent">Hệ Đa Agent (Multi-Agent System)</button>
            </div>

            <form id="prediction-form">
                <!-- Dropdown danh mục con theo từng mô hình -->
                <div class="form-group" id="subtask-group">
                    <label for="subtask-select" id="subtask-label">Tác Vụ Triển Khai</label>
                    <select id="subtask-select" name="subtask-select" onchange="onSubtaskChange()">
                        <!-- Cập nhật động theo mô hình qua JS -->
                    </select>
                </div>

                <!-- Lựa chọn cấu hình thuật toán -->
                <div class="form-group" id="model-group">
                    <label id="model-label">Mô Hình / Cấu Hình Thuật Toán</label>
                    <div class="radio-group" id="model-radios">
                        <!-- Cập nhật động qua JS -->
                    </div>
                </div>

                <!-- Vùng chứa input động của từng mô hình -->
                <div id="dynamic-inputs" class="dynamic-inputs">
                    <!-- Được thêm linh hoạt bằng JS -->
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span>Thực Hiện Dự Báo & Phân Tích</span>
                    <div class="loader"></div>
                </button>
            </form>

            <!-- Vùng hiển thị kết quả -->
            <div id="result-container" class="result-container hidden">
                <h3 id="result-title">Kết Quả Phân Tích & Dự Báo</h3>
                
                <div class="result-box">
                    <div class="model-badge" id="model-badge">Mô hình</div>
                    <div class="result-value" id="result-value">--</div>
                    <div class="result-confidence" id="result-confidence-box">
                        Độ tin cậy: <span id="result-confidence">--</span>%
                    </div>
                    <div id="explanation-box" class="explanation-box hidden"></div>
                </div>

                <!-- Khung biểu đồ Chart.js (Chỉ hiển thị cho RNN/LSTM chuỗi thời gian) -->
                <div id="chart-container" class="chart-container hidden">
                    <canvas id="predictionChart"></canvas>
                </div>

                <!-- Vùng chi tiết cho Knowledge Graph & RAG -->
                <div id="rag-details" class="rag-panel hidden"></div>

                <!-- Vùng chi tiết cho Hệ Đa Agent (MAS) -->
                <div id="agent-details" class="multi-agent-panel hidden"></div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=clean_mas_1"></script>
</body>
</html>
